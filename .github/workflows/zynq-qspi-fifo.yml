name: Zynq QSPI FIFO
on:
  pull_request:
    paths:
      - drivers/spi/spi_xlnx_zynq_qspi.c
      - tests/drivers/spi/zynq_qspi_fifo/**
      - .github/workflows/zynq-qspi-fifo.yml
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: python3 tests/drivers/spi/zynq_qspi_fifo/test_fifo.py
