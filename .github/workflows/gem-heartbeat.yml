name: GEM service heartbeat
on:
  pull_request:
    paths:
      - drivers/ethernet/eth_xlnx_gem.c
      - tests/drivers/ethernet/gem_heartbeat/**
      - .github/workflows/gem-heartbeat.yml
  push:
    branches: [feature/coap-update-boundary]
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: python3 tests/drivers/ethernet/gem_heartbeat/test_heartbeat.py
