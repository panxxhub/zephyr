description: Motorcomm YT8531 Ethernet PHY

compatible: "motorcomm,yt8531"

include: motorcomm,yt8521.yaml

properties:
  motorcomm,rxc-dly-en:
    type: boolean
    description: |
      Enable the PHY's coarse ~1.9 ns RXC clock delay (EXT 0xA001 bit 8 is an
      active-low disable; the driver clears it when this flag is present and
      sets it otherwise). Enable when the MAC captures RGMII RX with no clock
      delay of its own (e.g. the FPGA ESC ports); leave absent when the RX
      clock path already carries ~2 ns (e.g. Zynq PS GEM).
