common:
  platform_allow:
    - qemu_cortex_a9
  tags:
    - drivers
    - ethernet
tests:
  drivers.ethernet.xlnx_gem_loopback: {}
  drivers.ethernet.xlnx_gem_loopback.optin:
    extra_configs:
      - CONFIG_ETH_XLNX_GEM_RX_THREAD=y
      - CONFIG_ETH_XLNX_GEM_FRAME_SIZED_CACHE_OPS=y
      - CONFIG_ETH_XLNX_GEM_TX_DONE_WORKQ=y
      - CONFIG_ETH_XLNX_GEM_TX_RECLAIM=y
  drivers.ethernet.xlnx_gem_loopback.small_buffers:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=small_buffers.overlay
  drivers.ethernet.xlnx_gem_loopback.optin_small_buffers:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=small_buffers.overlay
    extra_configs:
      - CONFIG_ETH_XLNX_GEM_RX_THREAD=y
      - CONFIG_ETH_XLNX_GEM_FRAME_SIZED_CACHE_OPS=y
      - CONFIG_ETH_XLNX_GEM_TX_DONE_WORKQ=y
      - CONFIG_ETH_XLNX_GEM_TX_RECLAIM=y
