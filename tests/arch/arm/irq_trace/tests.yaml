common:
  tags:
    - interrupt
    - tracing
  platform_allow:
    - qemu_cortex_a9
  timeout: 15
  integration_platforms:
    - qemu_cortex_a9
tests:
  arch.arm.irq_trace: {}
  arch.arm.irq_trace.switch:
    extra_configs:
      - CONFIG_USE_SWITCH=y
      - CONFIG_FPU_SHARING=n
  arch.arm.irq_trace.isr_only:
    extra_configs:
      - CONFIG_TRACING_THREAD=n
      - CONFIG_TRACING_IDLE=n
  arch.arm.irq_trace.isr_only.switch:
    extra_configs:
      - CONFIG_USE_SWITCH=y
      - CONFIG_FPU_SHARING=n
      - CONFIG_TRACING_THREAD=n
      - CONFIG_TRACING_IDLE=n
  arch.arm.irq_trace.smp:
    extra_args:
      - IRQ_TRACE_SMP=ON
      - EXTRA_DTC_OVERLAY_FILE=smp.overlay
    extra_configs:
      - CONFIG_USE_SWITCH=y
      - CONFIG_FPU_SHARING=n
      - CONFIG_SMP=y
      - CONFIG_ARM_ARCH_TIMER=n
      - CONFIG_CORTEX_A9_PRIVATE_TIMER=y
      - CONFIG_QEMU_ICOUNT=n
      - CONFIG_MP_MAX_NUM_CPUS=2
      - CONFIG_SCHED_CPU_MASK=y
      - CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
