common:
  tags:
    - interrupt
    - tracing
  platform_allow:
    - qemu_cortex_a9
  timeout: 15
  integration_platforms:
    - qemu_cortex_a9
tests:
  arch.arm.irq_trace: {}
  arch.arm.irq_trace.switch:
    extra_configs:
      - CONFIG_USE_SWITCH=y
      - CONFIG_FPU_SHARING=n
  arch.arm.irq_trace.isr_only:
    extra_configs:
      - CONFIG_TRACING_THREAD=n
      - CONFIG_TRACING_IDLE=n
  arch.arm.irq_trace.isr_only.switch:
    extra_configs:
      - CONFIG_USE_SWITCH=y
      - CONFIG_FPU_SHARING=n
      - CONFIG_TRACING_THREAD=n
      - CONFIG_TRACING_IDLE=n
