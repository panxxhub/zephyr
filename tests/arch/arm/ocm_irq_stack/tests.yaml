common:
  tags:
    - kernel
    - interrupt
  platform_allow:
    - qemu_cortex_a9
  integration_platforms:
    - qemu_cortex_a9
tests:
  arch.arm.ocm_irq_stack.enabled:
    extra_configs:
      - CONFIG_ARM_ISR_STACKS_IN_OCM=y
  arch.arm.ocm_irq_stack.disabled:
    extra_configs:
      - CONFIG_ARM_ISR_STACKS_IN_OCM=n
